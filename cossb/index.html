<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conductor — Control Plane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/cossb/console.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">◈</div>
        <div class="brand-text">
          <div class="brand-name">Conductor</div>
          <div class="brand-sub">in-browser · OSS compatible</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item" data-route="/cossb/executions" href="/cossb/executions">
          <span class="nav-icon">▤</span> Executions

        <a class="nav-item" data-route="/cossb/workflows" href="/cossb/workflows">

        </a>
        <a class="nav-item" data-route="/cossb/tasks" href="/cossb/tasks">

          <span class="nav-icon">▦</span> Queues
        </a>
      </nav>

      <div class="sidebar-footer">
        <div id="engine-status" class="engine-status">
          <span class="dot"></span> <span>initializing…</span>
        </div>
        <div class="engine-note">Runs 100% in your browser · storage: localStorage</div>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <script src="/cossb/vendor/in-browser-conductor.js"></script>
  <script src="/cossb/console.js"></script>
